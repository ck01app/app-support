<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Premium Dark Slate Base Background (Matches slate-950) -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  
  <!-- Outer Soft Glowing Ring (Matches indigo-500/10) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#gradient-border)" stroke-width="8" opacity="0.8" />
  
  <!-- Central Smooth Icon Accent Shape -->
  <rect x="128" y="128" width="256" height="256" rx="64" fill="#6366f1" fill-opacity="0.06" stroke="#6366f1" stroke-width="3" stroke-opacity="0.2" />
  
  <!-- Sharp Modern Household Checkmark (Matches emerald-400 / indigo gradient) -->
  <path d="M192 256 L240 304 L336 192" fill="none" stroke="url(#gradient-check)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Gradients Definition -->
  <defs>
    <linearGradient id="gradient-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gradient-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
</svg>
