<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 💡 完好继承您成功加载的纯色和原生高级 CSS 滤镜架构 -->
  <style>
    .glow-track { filter: drop-shadow(0px 0px 7px #00F2FE) drop-shadow(0px 0px 4px #00FF87); }
    .chip-style { filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.65)); }
    .text-gold { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 105px; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <!-- 1. 背景弱光能量环 -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.1" />

