  <!-- 4. 核心黑色微芯片主体 -->
  <g class="chip-style">
    <!-- 外侧金属包边 -->
    <rect x="130" y="130" width="240" height="240" rx="24" fill="#3A414C" stroke="#F3B02C" stroke-width="3" />
    <!-- 芯片漆黑主体面 -->
    <rect x="146" y="146" width="208" height="208" rx="16" fill="#15191E" />
    <!-- 内部金色装饰内衬圈 -->
    <rect x="156" y="156" width="188" height="188" rx="12" fill="none" stroke="#FFE07D" stroke-width="1.5" opacity="0.35" />
  </g>

  <!-- 5. 芯片四角固定硬件微调螺丝 -->
