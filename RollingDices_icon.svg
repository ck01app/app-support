<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Casino Green Felt Background Gradient -->
    <linearGradient id="feltGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    
    <!-- Glossy Red Shaker Plastic Material Gradient -->
    <linearGradient id="plasticRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="35%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Deep inner shadow for the cup opening cavity -->
    <linearGradient id="innerRedShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#2D0505" />
    </linearGradient>

    <!-- Drop shadow for structural 3D layering -->
    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="112" fill="url(#feltGreen)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#047857" stroke-width="4" stroke-dasharray="10,6" opacity="0.4"/>

  <!-- ==================== LAYER 1: RED BASE TRAY ==================== -->
  <g filter="url(#shadowEffect)" transform="translate(0, 45)">
    <!-- Base outer wall ring structure -->
    <path d="M96,325 C96,380 416,380 416,325 L406,360 C406,410 106,410 106,360 Z" fill="#450A0A" />
    <!-- Main tray surface rim ellipse (Radius 160px) -->
    <ellipse cx="256" cy="342" rx="160" ry="48" fill="url(#plasticRed)" stroke="#B91C1C" stroke-width="2"/>
    <!-- Deep sunken tray interior bed -->
    <ellipse cx="256" cy="338" rx="142" ry="38" fill="#1E293B" opacity="0.12"/>
    <ellipse cx="256" cy="338" rx="142" ry="38" fill="none" stroke="#6B1D1D" stroke-width="3"/>
  </g>

  <!-- ==================== LAYER 2: THREE FULLY VISIBLE CHINESE WHITE DICE ==================== -->
  <!-- Arranged beautifully in the center of the tray with zero clipping or coverage -->
  
  <!-- Die #1 (Left): Showing 4 (Traditional Red Pips for Four) -->
  <g transform="translate(180, 335) rotate(14)" filter="url(#shadowEffect)">
    <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="-9" cy="-9" r="4" fill="#DC2626"/>
    <circle cx="9" cy="-9" r="4" fill="#DC2626"/>
    <circle cx="-9" cy="9" r="4" fill="#DC2626"/>
    <circle cx="9" cy="9" r="4" fill="#DC2626"/>
  </g>

  <!-- Die #2 (Center): Showing 1 (Large Oversized Center Red Pip) -->
  <g transform="translate(256, 350) rotate(-15)" filter="url(#shadowEffect)">
    <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#DC2626"/>
  </g>

  <!-- Die #3 (Right): Showing 6 (Charcoal Black Pips for Six) -->
  <g transform="translate(325, 332) rotate(35)" filter="url(#shadowEffect)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="-8" cy="-10" r="3" fill="#1E293B"/>
    <circle cx="-8" cy="0" r="3" fill="#1E293B"/>
    <circle cx="-8" cy="10" r="3" fill="#1E293B"/>
    <circle cx="8" cy="-10" r="3" fill="#1E293B"/>
    <circle cx="8" cy="0" r="3" fill="#1E293B"/>
    <circle cx="8" cy="10" r="3" fill="#1E293B"/>
  </g>

  <!-- ==================== LAYER 3: DOME CUP LIFTED COMPLETELY CLEAR ==================== -->
  <!-- Lifted up to Y=145 (moved up by 55 pixels) and hovering safely clear of the dice layout -->
  <g transform="translate(256, 145) rotate(-10) translate(-256, -145)" filter="url(#shadowEffect)">
    <!-- Base opening inner hollow background rim cavity -->
    <ellipse cx="256" cy="235" rx="142" ry="26" fill="url(#innerRedShadow)"/>
    
    <!-- Dome Body (Main frame proportions matched to image_b27cb9.png) -->
    <path d="M114,235 
             C108,75 155,20 256,20 
             C357,20 404,75 398,235 
             Z" 
          fill="url(#plasticRed)" stroke="#F87171" stroke-width="2.5"/>
          
    <!-- Rim lip molding definition rings -->
    <path d="M114,235 C114,251 398,251 398,235" fill="none" stroke="#DC2626" stroke-width="5"/>
    <path d="M114,235 C114,247 398,247 398,235" fill="none" stroke="#FCA5A5" stroke-width="1.5"/>

    <!-- Specular gloss highlight overlays -->
    <path d="M148,197 C144,107 184,50 224,43" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.28" stroke-linecap="round"/>
    <path d="M160,177 C157,123 188,75 212,70" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>
    <path d="M364,197 C370,137 348,80 312,60" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.12" stroke-linecap="round"/>
  </g>
</svg>
